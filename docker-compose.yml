version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc_track_app
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production-society-maintenance-secret-key-2026
    volumes:
      - ./prisma:/app/prisma
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
