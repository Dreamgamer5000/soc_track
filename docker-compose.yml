services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc_track_app
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=production-society-maintenance-secret-key-2026
    volumes:
      - soc_track_db_dev:/app/data
      - soc_track_uploads_dev:/app/public/uploads
    restart: unless-stopped

volumes:
  soc_track_db_dev:
  soc_track_uploads_dev:
